<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 250px;
        background-color: #171a21;
        color: #c7d5e0;
        font-family: "Motiva Sans", sans-serif;
        padding: 16px;
        margin: 0;
        user-select: none;
      }
      h3 {
        margin: 0 0 16px 0;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #fff;
        border-bottom: 1px solid #3c4d5d;
        padding-bottom: 8px;
      }
      h3.section-header {
        margin-top: 16px;
      }
      /* Card style for options */
      .option-card {
        display: flex;
        align-items: flex-start;
        background: #222b35;
        margin-bottom: 8px;
        padding: 10px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }
      .option-card:hover {
        background: #2a3540;
      }
      /* Custom radio styling */
      input[type="radio"] {
        appearance: none;
        -webkit-appearance: none;
        margin: 4px 10px 0 0;
        width: 16px;
        height: 16px;
        border: 2px solid #586977;
        border-radius: 50%;
        display: grid;
        place-content: center;
        flex-shrink: 0;
      }
      input[type="radio"]::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transform: scale(0);
        transition: 0.1s transform ease-in-out;
        background-color: #66c0f4;
      }
      input[type="radio"]:checked {
        border-color: #66c0f4;
      }
      input[type="radio"]:checked::before {
        transform: scale(1);
      }
      /* Highlight selected card */
      .option-card:has(input:checked) {
        background: #1b2838;
        border-color: #66c0f4;
        box-shadow: 0 0 8px rgba(102, 192, 244, 0.1);
      }

      .option-content {
        display: flex;
        flex-direction: column;
      }
      .option-title {
        font-weight: bold;
        color: #e1e1e1;
        font-size: 13px;
        margin-bottom: 2px;
      }
      .option-desc {
        font-size: 11px;
        color: #8f98a0;
        line-height: 1.3;
      }
      .version {
        font-size: 10px;
        color: #5d6e7b;
        text-align: center;
        margin-top: 16px;
        border-top: 1px solid #3c4d5d;
        padding-top: 8px;
      }
      .version a {
        color: #66c0f4;
        text-decoration: none;
        opacity: 0.8;
        transition: opacity 0.2s;
      }
      .version a:hover {
        opacity: 1;
        text-decoration: underline;
      }
      #clear-cache {
        width: 100%;
        padding: 10px;
        background: #222b35;
        color: #c7d5e0;
        border: 1px solid #3c4d5d;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 8px;
        font-family: inherit;
        font-size: 12px;
        transition: all 0.2s ease;
      }
      #clear-cache:hover {
        background: #2a3540;
        border-color: #66c0f4;
        color: #fff;
      }

      /* Statistics */
      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 10px;
        background: #222b35;
        border-radius: 4px;
        margin-bottom: 4px;
        font-size: 12px;
      }
      .stat-label {
        color: #8f98a0;
      }
      .stat-value {
        color: #66c0f4;
        font-weight: bold;
      }
      .reset-link {
        display: block;
        font-size: 10px;
        color: #586977;
        text-align: right;
        margin-top: 4px;
        cursor: pointer;
        text-decoration: none;
        transition: color 0.2s;
      }
      .reset-link:hover {
        color: #8f98a0;
      }

    </style>
  </head>
  <body>
    <h3>Steam AI Filter Settings</h3>

    <label class="option-card">
      <input type="radio" name="mode" value="highlight" />
      <div class="option-content">
        <span class="option-title">Highlight</span>
        <span class="option-desc">Red border + banner.</span>
      </div>
    </label>

    <label class="option-card">
      <input type="radio" name="mode" value="text" />
      <div class="option-content">
        <span class="option-title">Text Only (Default)</span>
        <span class="option-desc">Subtle [AI CONTENT USED] tag.</span>
      </div>
    </label>

    <label class="option-card">
      <input type="radio" name="mode" value="hide" />
      <div class="option-content">
        <span class="option-title">Hide It</span>
        <span class="option-desc">Remove from results entirely.</span>
      </div>
    </label>

    <button id="clear-cache">Clear Cache</button>

    <h3 class="section-header">Statistics</h3>
    <div class="stat-row">
      <span class="stat-label">Games checked</span>
      <span class="stat-value" id="stat-checked">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">AI-flagged games</span>
      <span class="stat-value" id="stat-flagged">--</span>
    </div>
    <a href="#" id="reset-stats" class="reset-link">Reset stats</a>

    <div id="promo-banner" style="
      display: none;
      margin-top: 12px;
      padding: 10px;
      background: #222b35;
      border: 1px solid #3c4d5d;
      border-radius: 4px;
      position: relative;
      font-size: 11px;
      line-height: 1.4;
      color: #8f98a0;
    ">
      <button id="promo-dismiss" style="
        position: absolute;
        top: 4px;
        right: 6px;
        background: none;
        border: none;
        color: #586977;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        padding: 0;
      " title="Dismiss">x</button>
      <div style="color: #c7d5e0; font-size: 12px; font-weight: bold; margin-bottom: 4px;">Check out my other extension!</div>
      <a
        href="https://chromewebstore.google.com/detail/private-wishlist-for-stea/ebjepohmnofeifmednegadnanoamipdi"
        target="_blank"
        style="color: #66c0f4; text-decoration: none;"
      >Private Wishlist for Steam</a>
    </div>

    <div class="version">
      <a
        href="https://chromewebstore.google.com/detail/fgkeoeoibigdcdkfdckkpodhfhppgdlo?utm_source=item-share-cb"
        target="_blank"
        >AI Generated Content Filter for Steam v3.4.0</a
      >
    </div>

    <script src="popup.js"></script>
  </body>
</html>
