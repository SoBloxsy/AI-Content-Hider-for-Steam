<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html, body {
        width: 280px;
        max-height: 560px;
        margin: 0;
        padding: 0;
        background-color: #171a21;
        color: #c7d5e0;
        font-family: "Motiva Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        user-select: none;
        overflow-x: hidden;
        overflow-y: auto;
      }
      /* Custom Steam-style slim scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #171a21;
      }
      ::-webkit-scrollbar-thumb {
        background: #3c4d5d;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #586977;
      }
      .container {
        padding: 14px;
      }
      h3 {
        margin: 0 0 10px 0;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: #8f98a0;
        border-bottom: 1px solid #2a3540;
        padding-bottom: 6px;
      }
      h3.section-header {
        margin-top: 14px;
      }
      /* Card style for options */
      .option-card {
        display: flex;
        align-items: center;
        background: #202731;
        margin-bottom: 6px;
        padding: 8px 10px;
        border-radius: 4px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: all 0.15s ease;
      }
      .option-card:hover {
        background: #283340;
      }
      /* Custom radio & checkbox styling */
      input[type="radio"], input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        margin: 0 10px 0 0;
        width: 15px;
        height: 15px;
        border: 2px solid #586977;
        display: grid;
        place-content: center;
        flex-shrink: 0;
        cursor: pointer;
      }
      input[type="radio"] {
        border-radius: 50%;
      }
      input[type="checkbox"] {
        border-radius: 3px;
      }
      input[type="radio"]::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        transform: scale(0);
        transition: 0.1s transform ease-in-out;
        background-color: #66c0f4;
      }
      input[type="checkbox"]::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 1px;
        transform: scale(0);
        transition: 0.1s transform ease-in-out;
        background-color: #66c0f4;
      }
      input[type="radio"]:checked, input[type="checkbox"]:checked {
        border-color: #66c0f4;
      }
      input[type="radio"]:checked::before, input[type="checkbox"]:checked::before {
        transform: scale(1);
      }
      /* Highlight selected card */
      .option-card:has(input:checked) {
        background: #1b2838;
        border-color: #66c0f4;
      }

      .option-content {
        display: flex;
        flex-direction: column;
        flex: 1;
      }
      .option-title {
        font-weight: bold;
        color: #e1e1e1;
        font-size: 12px;
        line-height: 1.2;
        margin-bottom: 2px;
      }
      .option-desc {
        font-size: 10px;
        color: #8f98a0;
        line-height: 1.25;
      }
      #clear-cache {
        width: 100%;
        padding: 8px;
        background: #222b35;
        color: #c7d5e0;
        border: 1px solid #3c4d5d;
        border-radius: 4px;
        cursor: pointer;
        margin-top: 8px;
        font-family: inherit;
        font-size: 11px;
        font-weight: 500;
        transition: all 0.15s ease;
      }
      #clear-cache:hover {
        background: #2a3540;
        border-color: #66c0f4;
        color: #fff;
      }

      /* Statistics */
      .stat-row {
        display: flex;
        justify-content: space-between;
        padding: 5px 8px;
        background: #202731;
        border-radius: 3px;
        margin-bottom: 4px;
        font-size: 11px;
      }
      .stat-label {
        color: #8f98a0;
      }
      .stat-value {
        color: #66c0f4;
        font-weight: bold;
      }
      .reset-link {
        display: block;
        font-size: 10px;
        color: #586977;
        text-align: right;
        margin-top: 4px;
        cursor: pointer;
        text-decoration: none;
        transition: color 0.15s;
      }
      .reset-link:hover {
        color: #8f98a0;
      }

      .version {
        font-size: 10px;
        color: #5d6e7b;
        text-align: center;
        margin-top: 14px;
        border-top: 1px solid #2a3540;
        padding-top: 8px;
      }
      .version a {
        color: #66c0f4;
        text-decoration: none;
        opacity: 0.8;
        transition: opacity 0.15s;
      }
      .version a:hover {
        opacity: 1;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>Filter Mode</h3>

      <label class="option-card">
        <input type="radio" name="mode" value="highlight" />
        <div class="option-content">
          <span class="option-title">Highlight</span>
          <span class="option-desc">Color outline & banner overlay.</span>
        </div>
      </label>

      <label class="option-card">
        <input type="radio" name="mode" value="text" />
        <div class="option-content">
          <span class="option-title">Text Only (Default)</span>
          <span class="option-desc">Categorized badge tag (e.g. AI: ART).</span>
        </div>
      </label>

      <label class="option-card">
        <input type="radio" name="mode" value="hide" />
        <div class="option-content">
          <span class="option-title">Hide Games</span>
          <span class="option-desc">Remove matching games completely.</span>
        </div>
      </label>

      <h3 class="section-header">Exceptions / Allowlist</h3>

      <label class="option-card">
        <input type="checkbox" id="ignore-localization" />
        <div class="option-content">
          <span class="option-title">Ignore Translations</span>
          <span class="option-desc">Subtitles, localization, and grammar.</span>
        </div>
      </label>

      <label class="option-card">
        <input type="checkbox" id="ignore-code" />
        <div class="option-content">
          <span class="option-title">Ignore Code & Dev Tools</span>
          <span class="option-desc">Copilot, coding, and mechanics scripts.</span>
        </div>
      </label>

      <label class="option-card">
        <input type="checkbox" id="ignore-concept-art" />
        <div class="option-content">
          <span class="option-title">Ignore Concept Art</span>
          <span class="option-desc">Ideation art not in the final game.</span>
        </div>
      </label>

      <label class="option-card">
        <input type="checkbox" id="ignore-marketing" />
        <div class="option-content">
          <span class="option-title">Ignore Marketing</span>
          <span class="option-desc">Capsules, store page graphics, trailers.</span>
        </div>
      </label>

      <label class="option-card">
        <input type="checkbox" id="ignore-early-access" />
        <div class="option-content">
          <span class="option-title">Ignore Early Access</span>
          <span class="option-desc">Skip AI flags/filters on Early Access titles.</span>
        </div>
      </label>

      <label class="option-card">
        <input type="checkbox" id="ignore-pre-release" />
        <div class="option-content">
          <span class="option-title">Ignore Pre-Release</span>
          <span class="option-desc">Skip AI flags/filters on Coming Soon / Pre-Purchase.</span>
        </div>
      </label>

      <button id="clear-cache" type="button">Clear Cache</button>

      <h3 class="section-header">Statistics</h3>
      <div class="stat-row">
        <span class="stat-label">Games checked</span>
        <span class="stat-value" id="stat-checked">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">AI-flagged games</span>
        <span class="stat-value" id="stat-flagged">--</span>
      </div>
      <a href="#" id="reset-stats" class="reset-link">Reset stats</a>

      <div class="version">
        <a
          id="version-link"
          href="https://chromewebstore.google.com/detail/fgkeoeoibigdcdkfdckkpodhfhppgdlo?utm_source=item-share-cb"
          target="_blank"
          >AI Content Filter for Steam v3.5.1</a
        >
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
